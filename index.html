<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>калькулятор</title>
    <link rel="preconnect" href ="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="calculator">
    <div id="sakura"></div>        
            <div class = table id="screen">0</div>
    <div class="buttons">
        <button class="btn" id="root" >√</button>
        <button id="degree">n^</button>
        <button id="percent">%</button>
        <button class ="btn num" id="dot" data-val=".">.</button>
    <button  class="btn num" id="one" data-val ="1">1</button>
    <button class="btn num" id ="two" data-val ="2">2</button>
    <button class="btn num" id ="three" data-val ="3">3</button>
    <button class="btn" id="plus">+</button>
    <button class="btn num" id ="four" data-val ="4">4</button>
    <button class="btn num" id ="five" data-val ="5">5</button>
    <button class="btn num" id ="six" data-val ="6">6</button>
    <button id="minus">-</button>
    <button class="btn num" id ="seven" data-val ="7">7</button>
    <button  class="btn num" id ="eight" data-val ="8">8</button>
    <button class="btn num" id ="nine" data-val ="9">9</button>
    <button id="times">*</button>
    <button id ="equals">=</button>
    <button class=" btn num" id ="null" data-val ="0">0</button>
    <button class="btn" id="clear">C</button>
    <button id="divide">/</button>
    </div>
</div>
<script src="script.js"></script>
</body>

</html>
